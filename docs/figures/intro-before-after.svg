<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t3 d3"><title id="t3">From chat-thread orders to a structured workflow</title><desc id="d3">Before: orders, prices and dates live in message threads and memory, and purchasing runs on gut feel. After: orders come in through a website into one database, a weekly forecast drives what to bake and buy, and the owner sees it all in one place.</desc><rect width="1000" height="300" fill="#ffffff"/>
<rect x="20" y="20" width="430" height="260" rx="16" fill="#fbeeec"/>
<text x="44" y="58" font-size="20" font-weight="700" fill="#b0473a">Before</text>
<circle cx="54" cy="91" r="6" fill="#b0473a"/><text x="72" y="96" font-size="15.5" fill="#1f2a44">Orders spread across calls, texts and chats</text>
<circle cx="54" cy="135" r="6" fill="#b0473a"/><text x="72" y="140" font-size="15.5" fill="#1f2a44">Prices and dates agreed message by message</text>
<circle cx="54" cy="179" r="6" fill="#b0473a"/><text x="72" y="184" font-size="15.5" fill="#1f2a44">Daily bake quantities set by intuition</text>
<circle cx="54" cy="223" r="6" fill="#b0473a"/><text x="72" y="228" font-size="15.5" fill="#1f2a44">Ingredients bought on informal minimums</text>
<rect x="550" y="20" width="430" height="260" rx="16" fill="#e8eef7"/>
<text x="574" y="58" font-size="20" font-weight="700" fill="#2f6db5">After</text>
<circle cx="584" cy="91" r="6" fill="#2f6db5"/><text x="602" y="96" font-size="15.5" fill="#1f2a44">Customers order and pick dates on a website</text>
<circle cx="584" cy="135" r="6" fill="#2f6db5"/><text x="602" y="140" font-size="15.5" fill="#1f2a44">Every order lands in one database</text>
<circle cx="584" cy="179" r="6" fill="#2f6db5"/><text x="602" y="184" font-size="15.5" fill="#1f2a44">Weekly forecast sets bake and buy plans</text>
<circle cx="584" cy="223" r="6" fill="#2f6db5"/><text x="602" y="228" font-size="15.5" fill="#1f2a44">Dashboard and 60-second daily count form</text>
<path d="M462 150h70" stroke="#5a6478" stroke-width="3"/><path d="M530 141l12 9-12 9z" fill="#5a6478"/></svg>