<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Portal de administración — Sample Bakery</title>
  <link rel="icon" href="assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playball&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Jost:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="admin">

  <section class="login" data-view="login" hidden>
    <form class="login-card" data-login novalidate>
      <img src="assets/img/logo.svg" alt="" class="login-logo">
      <div class="script" style="font-size:34px;color:var(--maroon-700)">Sample Bakery</div>
      <p class="muted" style="margin:4px 0 24px">Portal de pedidos</p>
      <div class="field"><label for="l-email">Correo</label><input class="input" id="l-email" name="email" type="email" required autocomplete="username"></div>
      <div class="field"><label for="l-pass">Contraseña</label><input class="input" id="l-pass" name="password" type="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      <button class="link-btn" type="button" data-forgot>Olvidé mi contraseña</button>
      <div class="notice" data-login-msg hidden role="alert" style="margin-top:16px"></div>
    </form>
  </section>

  <section class="login" data-view="mfa" hidden>
    <div class="login-card" data-mfa></div>
  </section>

  <section class="setup" data-view="setup" hidden>
    <div class="login-card">
      <div class="script" style="font-size:34px;color:var(--maroon-700)">Sample Bakery</div>
      <h2 style="margin:12px 0">El portal aún no está conectado</h2>
      <p class="muted">Falta poner la dirección y la llave de Supabase en <code>js/config.js</code>.</p>
    </div>
  </section>

  <div class="app" data-view="app" hidden>
    <header class="topbar">
      <div class="brand"><img src="assets/img/logo.svg" alt=""><span>Sample Bakery</span></div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="calendar" aria-selected="true">Calendario</button>
        <button role="tab" data-tab="orders" aria-selected="false">Órdenes <span class="count" data-count="orders"></span></button>
        <button role="tab" data-tab="quotes" aria-selected="false">Cotizaciones <span class="count" data-count="quotes"></span></button>
        <button role="tab" data-tab="summary" aria-selected="false">Resumen</button>
        <button role="tab" data-tab="catalog" aria-selected="false">Precios y menú</button>
      </nav>
      <div class="topbar-right">
        <button class="icon-btn" type="button" data-refresh title="Actualizar" aria-label="Actualizar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        </button>
        <button class="link-btn" type="button" data-logout>Salir</button>
      </div>
    </header>

    <main class="admin-main">
      <section data-panel="calendar">
        <div class="cal-layout">
          <div>
            <div class="cal-head">
              <button class="icon-btn" type="button" data-month="-1" aria-label="Mes anterior">‹</button>
              <h1 data-month-label></h1>
              <button class="icon-btn" type="button" data-month="1" aria-label="Mes siguiente">›</button>
              <button class="btn btn-outline btn-sm" type="button" data-today>Hoy</button>
            </div>
            <div class="legend">
              <span><i class="dot accepted"></i>Orden aceptada</span>
              <span><i class="dot quote"></i>Cotización aceptada</span>
              <span><i class="dot pending"></i>Pendiente de responder</span>
              <span><i class="dot blocked"></i>Día bloqueado</span>
            </div>
            <div class="cal-grid" data-calendar></div>
          </div>
          <aside class="day-panel" data-day-panel></aside>
        </div>
      </section>

      <section data-panel="orders" hidden>
        <div class="list-head">
          <h1>Órdenes</h1>
          <input class="input search-box" type="search" data-search="orders" placeholder="Buscar por nombre o número" aria-label="Buscar órdenes">
          <div class="filters" data-filter-group="orders"></div>
        </div>
        <div class="cards" data-list="orders"></div>
      </section>

      <section data-panel="quotes" hidden>
        <div class="list-head">
          <h1>Cotizaciones</h1>
          <input class="input search-box" type="search" data-search="quotes" placeholder="Buscar por nombre o número" aria-label="Buscar cotizaciones">
          <div class="filters" data-filter-group="quotes"></div>
        </div>
        <div class="cards" data-list="quotes"></div>
      </section>

      <section data-panel="summary" hidden>
        <div class="list-head no-print"><h1>Resumen</h1></div>
        <div data-summary-body></div>
      </section>

      <section data-panel="catalog" hidden>
        <div class="list-head">
          <h1>Precios y menú</h1>
          <div class="filters" data-cat-tabs role="group" aria-label="Secciones del menú"></div>
        </div>
        <div data-cat-body></div>
      </section>

    </main>
  </div>

  <dialog class="modal" data-modal>
    <form method="dialog" class="modal-body" data-modal-form novalidate></form>
  </dialog>

  <div class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/builder.js"></script>
  <script src="js/catalog-admin.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
