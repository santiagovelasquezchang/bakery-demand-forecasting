<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Sample Bakery</title>
  <link rel="icon" href="assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playball&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Jost:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="gallery">
  <main class="container">
    <header class="page-head">
      <div class="eyebrow">Our work</div>
      <h1>Cakes we've made with love</h1>
      <p class="lede">Browse by occasion. See something you love? Tap it to request one just like it.</p>
    </header>

    <div class="filters" data-filters role="group" aria-label="Filter by occasion"></div>
    <div class="gallery" data-gallery></div>
    <p class="gallery-note">Sample designs. Every cake is made to order.</p>

    <section class="section-sm">
      <div class="band reveal">
        <div>
          <h2>Love something you see?</h2>
          <p>Build your own version or send us a photo for a personal quote.</p>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <a class="btn btn-gold" href="builder.html">Build your cake</a>
          <a class="btn btn-ghost" href="quote.html">Request a quote</a>
        </div>
      </div>
    </section>
  </main>

  <div class="lightbox" data-open="false" role="dialog" aria-modal="true" aria-label="Cake photo">
    <button class="lightbox-close" type="button" aria-label="Close">×</button>
    <figure>
      <img src="" alt="">
      <figcaption>
        <h3></h3>
        <a class="btn btn-gold" data-request href="quote.html">Request a cake like this</a>
      </figcaption>
    </figure>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="js/demo-backend.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
